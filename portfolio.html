<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Coleções fotográficas de Miguel Lopes.">
  <title>Portfolio — Miguel Lopes</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <a class="profile-link" href="index.html" aria-label="Página inicial de Miguel Lopes">
        <img class="profile-image" src="images/profile/miguel.webp" alt="Retrato de Miguel Lopes">
        <div class="identity">
          <span class="identity-name">Miguel Lopes</span>
          <span class="identity-role">Photography</span>
        </div>
      </a>

      <nav class="primary-nav" aria-label="Navegação principal">
        <div class="nav-group">
          <button class="nav-link portfolio-toggle" type="button" aria-expanded="true" aria-controls="portfolio-submenu">Portfolio</button>
          <div class="portfolio-submenu open" id="portfolio-submenu">
            <a data-category-link="greve-geral" href="portfolio.html?category=greve-geral">Greve Geral</a>
            <a data-category-link="mega-centrais-solares" href="portfolio.html?category=mega-centrais-solares">Não às mega centrais solares</a>
            <a data-category-link="street-moments" href="portfolio.html?category=street-moments">Street Moments</a>
            <a data-category-link="wsl" href="portfolio.html?category=wsl">WSL</a>
            <a data-category-link="diversos" href="portfolio.html?category=diversos">Diversos</a>
            <a data-category-link="retratos" href="portfolio.html?category=retratos">Retratos</a>
          </div>
        </div>
        <a class="nav-link" href="about.html">About</a>
      </nav>

      <div class="sidebar-footer">© Miguel Lopes</div>
    </aside>

    <main class="content portfolio-content" data-portfolio-page>
      <p class="page-kicker">Portfolio</p>
      <h1 class="page-title" data-collection-title>Greve Geral</h1>
      <p class="collection-count" data-collection-count></p>
      <section class="portfolio-grid" data-gallery aria-live="polite"></section>
      <p class="empty-collection" data-empty hidden>Esta coleção ainda não tem imagens adicionadas.</p>
    </main>
  </div>

  <div class="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Visualização de fotografia">
    <button class="lightbox-close" aria-label="Fechar">×</button>
    <button class="lightbox-prev" aria-label="Fotografia anterior">‹</button>
    <img class="lightbox-image" src="" alt="">
    <button class="lightbox-next" aria-label="Fotografia seguinte">›</button>
    <div class="lightbox-count" aria-live="polite"></div>
  </div>

  <script src="assets/js/main.js" defer></script>
</body>
</html>
